spring.application.name=open-source-finder

# Optional GitHub token: raises the API rate limit from 60 to 5000 requests/hour (search: 10 to 30/minute).
github.token=${GITHUB_TOKEN:}
# Only repositories with at least this many stars are listed.
github.min-stars=1000
# Repositories fetched per search (GitHub allows up to 100).
github.page-size=30
